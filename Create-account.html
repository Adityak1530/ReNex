<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReNex - Your Virtual Portfolio</title>
  <link rel="icon" type="image/x-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="create-account.css" />
  <style>
    .notification {
      padding: 15px;
      margin: 10px 0;
      border-radius: 4px;
      display: none;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    /* Password visibility toggle styles */
    .password-container {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .password-toggle {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #999;
      transition: color 0.3s ease;
      z-index: 2;
    }

    .password-toggle:hover {
      color: #556B2F;
    }

    .password-toggle svg {
      display: block;
    }

    .password-container input[type="password"],
    .password-container input[type="text"] {
      padding-right: 50px;
    }
  </style>
</head>

<body>
  <div class="center-wrapper">
    <!-- Home Link -->
    <div style="position: absolute; top: 20px; left: 20px; z-index: 100;">
      <a href="index.html" style="color: #556B2F; text-decoration: none; font-weight: 600; font-size: 20px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.9); padding: 12px; border-radius: 50%; border: 1px solid rgba(85, 107, 47, 0.2); backdrop-filter: blur(10px); transition: all 0.3s ease; width: 44px; height: 44px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        🏠
      </a>
    </div>
    
    <div class="form-card">
      <h1 class="form-title">Create Your ReNex Portfolio</h1>
      <p class="form-subtitle">Join the virtual portfolio community</p>
      <div id="notification" class="notification"></div>

      <form class="create-account-form" autocomplete="off">
        <input type="text" name="full_name" placeholder="Full Name" value="" autocomplete="off" required />
        <input type="email" name="email" placeholder="Email Address" value="" autocomplete="off" required />
        <input type="text" name="phone" placeholder="Phone Number" value="" autocomplete="off" required />
        <div class="password-container">
            <input type="password" name="password" id="password-field" placeholder="Password" value="" autocomplete="new-password" required />
            <span class="password-toggle" onclick="togglePasswordByName('password', this)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.61-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </span>
        </div>
        <div class="password-container">
            <input type="password" name="confirm_password" id="confirm-password-field" placeholder="Confirm Password" value="" autocomplete="new-password" required />
            <span class="password-toggle" onclick="togglePasswordByName('confirm_password', this)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.61-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </span>
        </div>

        <div class="form-button">
          <button type="submit" class="primary-btn">Create Account</button>
        </div>
      </form>

      <p class="form-footer">
        Already have an account? <a href="login.html" class="link-btn">Login</a>
      </p>
    </div>
  </div>

  <!-- Direct Sanity API client - no CDN needed! -->
  <script>
    // Direct Sanity API client class
    class DirectSanityClient {
      constructor(config) {
        this.projectId = config.projectId;
        this.dataset = config.dataset;
        this.token = config.token;
        this.apiVersion = config.apiVersion;
        this.baseUrl = `https://${config.projectId}.api.sanity.io/v${config.apiVersion}/data/mutate/${config.dataset}`;
        this.queryUrl = `https://${config.projectId}.api.sanity.io/v${config.apiVersion}/data/query/${config.dataset}`;
        
        // Detect if we're in local development or production
        this.isLocalDev = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
        this.apiUrl = this.isLocalDev ? null : `${window.location.origin}/api/sanity-proxy`;
        
        console.log('Initialized Sanity client');
        console.log('Environment:', this.isLocalDev ? 'Local Development' : 'Production');
        console.log('API URL:', this.isLocalDev ? 'Direct Sanity API' : this.apiUrl);
      }
      
      async create(doc, retryCount = 0, maxRetries = 3) {
        try {
          console.log('Creating document:', doc);
          console.log('Retry attempt:', retryCount);
          
          let url, requestConfig;
          
          if (this.isLocalDev) {
            // Use direct Sanity API for local development
            url = this.baseUrl;
            requestConfig = {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${this.token}`
              },
              body: JSON.stringify({
                mutations: [{
                  create: doc
                }]
              })
            };
          } else {
            // Use API proxy for production
            const baseUrl = window.location.origin;
            const mutationUrl = `${baseUrl}/api/sanity-proxy`;
            url = retryCount > 0 ? `${mutationUrl}?_cb=${Date.now()}` : mutationUrl;
            
            requestConfig = {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${this.token}`
              },
              body: JSON.stringify({
                mutation: true,
                projectId: this.projectId,
                dataset: this.dataset,
                mutations: [{
                  create: doc
                }]
              })
            };
          }
          
          // Create abort controller for timeout
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 15000);
          requestConfig.signal = controller.signal;
          
          const response = await fetch(url, requestConfig);
          
          // Clear the timeout
          clearTimeout(timeoutId);
          
          if (!response.ok) {
            // If we haven't exceeded max retries and it's a 404 or 5xx error, retry
            if (retryCount < maxRetries && (response.status === 404 || response.status >= 500)) {
              console.log(`Retrying after ${response.status} error (attempt ${retryCount + 1} of ${maxRetries})`);
              // Exponential backoff: wait longer between each retry
              const backoffTime = Math.min(1000 * Math.pow(2, retryCount), 8000);
              await new Promise(resolve => setTimeout(resolve, backoffTime));
              return this.create(doc, retryCount + 1, maxRetries);
            }
            
            // If we've exhausted retries or it's not a retryable error, handle the error
            let errorMessage = `HTTP ${response.status}`;
            // Clone the response before reading its body
            const responseClone = response.clone();
            try {
              // Try to parse error as JSON
              const errorJson = await responseClone.json();
              errorMessage += `: ${JSON.stringify(errorJson)}`;
            } catch (e) {
              // Fallback to text if not JSON
              try {
                const errorText = await responseClone.text();
                errorMessage += `: ${errorText}`;
              } catch (textError) {
                errorMessage += `: Unable to read response body`;
              }
            }
            throw new Error(errorMessage);
          }
          
          const result = await response.json();
          console.log('Document created successfully:', result);
          
          // Return the created document with ID
          if (result.results && result.results[0]) {
            return {
              _id: result.results[0].id,
              ...doc
            };
          }
          
          return result;
          
        } catch (error) {
          console.error('Error creating document:', error);
          throw error;
        }
      }
      
      async fetch(query, params = {}, retryCount = 0, maxRetries = 3) {
        try {
          console.log('Fetching data:', query, params);
          console.log('Retry attempt:', retryCount);
          
          let queryUrl, requestConfig;
          
          if (this.isLocalDev) {
            // Use direct Sanity API for local development
            queryUrl = `${this.queryUrl}?query=${encodeURIComponent(query)}`;
            
            // Add GROQ parameters for direct API
            if (Object.keys(params).length > 0) {
              Object.entries(params).forEach(([key, value]) => {
                queryUrl += `&$${key}=${encodeURIComponent(JSON.stringify(value))}`;
              });
            }
            
            // Add cache-busting parameter for retries
            if (retryCount > 0) {
              queryUrl += `&_cb=${Date.now()}`;
            }
            
            requestConfig = {
              method: 'GET',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${this.token}`
              }
            };
          } else {
            // Use API proxy for production
            const baseUrl = window.location.origin;
            queryUrl = `${baseUrl}/api/sanity-proxy?query=${encodeURIComponent(query)}`;
            
            // Add GROQ parameters in the correct format
            if (Object.keys(params).length > 0) {
              Object.entries(params).forEach(([key, value]) => {
                queryUrl += `&$${key}=${encodeURIComponent(JSON.stringify(value))}`;
              });
            }
            
            // Add project ID and dataset as parameters
            queryUrl += `&projectId=${this.projectId}&dataset=${this.dataset}`;
            
            // Add cache-busting parameter for retries
            if (retryCount > 0) {
              queryUrl += `&_cb=${Date.now()}`;
            }
            
            requestConfig = {
              method: 'GET',
              headers: {
                'Content-Type': 'application/json'
              }
            };
          }
          
          console.log('Full query URL:', queryUrl);
          
          // Create abort controller for timeout
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 10000);
          requestConfig.signal = controller.signal;
          
          const response = await fetch(queryUrl, requestConfig);
          
          // Clear the timeout
          clearTimeout(timeoutId);
          
          if (!response.ok) {
            // If we haven't exceeded max retries and it's a 404 or 5xx error, retry
            if (retryCount < maxRetries && (response.status === 404 || response.status >= 500)) {
              console.log(`Retrying after ${response.status} error (attempt ${retryCount + 1} of ${maxRetries})`);
              // Exponential backoff: wait longer between each retry
              const backoffTime = Math.min(1000 * Math.pow(2, retryCount), 8000);
              await new Promise(resolve => setTimeout(resolve, backoffTime));
              return this.fetch(query, params, retryCount + 1, maxRetries);
            }
            
            // If we've exhausted retries or it's not a retryable error, handle the error
            let errorMessage = `HTTP ${response.status}`;
            // Clone the response before reading its body
            const responseClone = response.clone();
            try {
              // Try to parse error as JSON
              const errorJson = await responseClone.json();
              errorMessage += `: ${JSON.stringify(errorJson)}`;
            } catch (e) {
              // Fallback to text if not JSON
              try {
                const errorText = await responseClone.text();
                errorMessage += `: ${errorText}`;
              } catch (textError) {
                errorMessage += `: Unable to read response body`;
              }
            }
            throw new Error(errorMessage);
          }
          
          const result = await response.json();
          console.log('Query result:', result);
          
          // Handle different response formats
          if (this.isLocalDev) {
            // Direct Sanity API returns result directly
            return result.result;
          } else {
            // API proxy returns result wrapped
            return result.result;
          }
          
        } catch (error) {
          console.error('Error fetching data:', error);
          throw error;
        }
      }
      
      async createOrReplace(doc, retryCount = 0, maxRetries = 3) {
        try {
          console.log('Creating or replacing document:', doc);
          console.log('Retry attempt:', retryCount);
          
          let url, requestConfig;
          
          if (this.isLocalDev) {
            // Use direct Sanity API for local development
            url = this.baseUrl;
            requestConfig = {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${this.token}`
              },
              body: JSON.stringify({
                mutations: [{
                  createOrReplace: doc
                }]
              })
            };
          } else {
            // Use API proxy for production
            const baseUrl = window.location.origin;
            const mutationUrl = `${baseUrl}/api/sanity-proxy`;
            url = retryCount > 0 ? `${mutationUrl}?_cb=${Date.now()}` : mutationUrl;
            
            requestConfig = {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${this.token}`
              },
              body: JSON.stringify({
                mutation: true,
                projectId: this.projectId,
                dataset: this.dataset,
                mutations: [{
                  createOrReplace: doc
                }]
              })
            };
          }
          
          // Create abort controller for timeout
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 15000);
          requestConfig.signal = controller.signal;
          
          const response = await fetch(url, requestConfig);
          
          // Clear the timeout
          clearTimeout(timeoutId);
          
          if (!response.ok) {
            // If we haven't exceeded max retries and it's a 404 or 5xx error, retry
            if (retryCount < maxRetries && (response.status === 404 || response.status >= 500)) {
              console.log(`Retrying after ${response.status} error (attempt ${retryCount + 1} of ${maxRetries})`);
              // Exponential backoff: wait longer between each retry
              const backoffTime = Math.min(1000 * Math.pow(2, retryCount), 8000);
              await new Promise(resolve => setTimeout(resolve, backoffTime));
              return this.createOrReplace(doc, retryCount + 1, maxRetries);
            }
            
            // If we've exhausted retries or it's not a retryable error, handle the error
            let errorMessage = `HTTP ${response.status}`;
            // Clone the response before reading its body
            const responseClone = response.clone();
            try {
              // Try to parse error as JSON
              const errorJson = await responseClone.json();
              errorMessage += `: ${JSON.stringify(errorJson)}`;
            } catch (e) {
              // Fallback to text if not JSON
              try {
                const errorText = await responseClone.text();
                errorMessage += `: ${errorText}`;
              } catch (textError) {
                errorMessage += `: Unable to read response body`;
              }
            }
            throw new Error(errorMessage);
          }
          
          const result = await response.json();
          console.log('Document created or replaced successfully:', result);
          
          return result;
          
        } catch (error) {
          console.error('Error creating or replacing document:', error);
          throw error;
        }
      }
    }
    
    // Initialize the Sanity client
    const client = new DirectSanityClient({
      projectId: 'ce5tdyqn',
      dataset: 'production',
      token: 'skAWoKWyWjwX1Yltb2H0KecdrtvZxvHS4n0itSz1QOwrgPDt0tI17KQAuUHILqvS1jcsM2Zjm1YfM5zc3aLOPOF4oVvaNQ1cp9iWPcsS8rxiA26WM0HWrrqciju6pip7KCSGnn3P9n5Szdb1eYhhuMSQAOUAvipmZHMTJHSTEVTv7XcFYtVn',
      apiVersion: '2023-05-03'
    });

    // Ensure form is completely clean on page load
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.querySelector('.create-account-form');
      const inputs = form.querySelectorAll('input');
      
      // Clear all input values
      inputs.forEach(input => {
        input.value = '';
        input.setAttribute('value', '');
      });
      
      // Reset the form
      form.reset();
    });
    
    console.log('✅ Direct Sanity client initialized successfully!');
    console.log('Project ID: ce5tdyqn');

    // Password visibility toggle function
    function togglePasswordByName(inputName, toggleElement) {
      const passwordInput = document.querySelector(`input[name="${inputName}"]`);
      const isPassword = passwordInput.type === 'password';
      
      // Toggle input type
      passwordInput.type = isPassword ? 'text' : 'password';
      
      // Toggle icon
      const svg = toggleElement.querySelector('svg path');
      if (isPassword) {
        // Show "eye-off" icon when password is visible
        svg.setAttribute('d', 'M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92 1.41-1.41L3.97 3.34 2.56 4.75l2.76 2.76C5.68 8.09 6 8.53 6 9c0 2.76 2.24 5 5 5-.47 0-.91-.32-1.49-.68l1.42 1.42c.47.36 1.02.68 1.59.68 2.76 0 5-2.24 5-5 0-.57-.32-1.12-.68-1.59L19.73 8.27C20.09 9.38 20.5 10.64 21 12c-1.73 4.39-6 7.5-11 7.5-1.4 0-2.74-.25-3.98-.7l2.16-2.16C8.74 16.87 9.35 17 10 17c2.76 0 5-2.24 5-5 0-.65-.13-1.26-.36-1.83l-1.42 1.42C13.68 11.91 14 12.47 14 13c0 1.66-1.34 3-3 3s-3-1.34-3-3c0-.53.32-1.09.68-1.42L6.27 9.17C5.91 10.28 5.5 11.54 5 13c1.73-4.39 6-7.5 11-7.5z');
      } else {
        // Show "eye" icon when password is hidden
        svg.setAttribute('d', 'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.61-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z');
      }
    }

    // Sanity.io-based account creation
    document.querySelector('.create-account-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      try {
        const notification = document.getElementById('notification');
        notification.style.display = 'none';
        notification.className = 'notification';

        const formData = new FormData(e.target);
        const userData = {
          full_name: formData.get('full_name'),
          email: formData.get('email'),
          phone: formData.get('phone'),
          password: formData.get('password')
        };

        if (formData.get('password') !== formData.get('confirm_password')) {
          throw new Error('Passwords do not match');
        }

        if (formData.get('password').length < 6) {
          throw new Error('Password must be at least 6 characters long');
        }

        console.log('Checking for existing user...');
        // Check if user already exists
        const existingUser = await client.fetch('*[_type == "user" && email == $email][0]', { email: userData.email });

        if (existingUser) {
          throw new Error('An account with this email already exists');
        }

        console.log('Generating ReNex ID...');
        // Generate ReNex ID
        const rexId = generateReNexId(userData.phone);
        console.log('Generated ReNex ID:', rexId);

        console.log('Creating user in Sanity...');
        // Create user in Sanity
        const newUser = await client.create({
          _type: 'user',
          email: userData.email,
          fullName: userData.full_name,
          phone: userData.phone,
          passwordHash: await hashPassword(userData.password),
          rexId: rexId
        });

        if (!newUser) {
          throw new Error('Failed to create account');
        }

        console.log('User created successfully:', newUser);

        console.log('Creating initial profile...');
        // Create initial profile
        try {
          const profile = await client.createOrReplace({
            _type: 'profile',
            _id: 'profile-' + newUser._id,
            user_id: newUser._id,
            name: userData.full_name,
            role: 'Not specified',
            bio: 'Welcome to ReNex! Create your virtual portfolio by editing your profile.'
          });
          console.log('Profile created successfully:', profile);
        } catch (profileError) {
          console.error('Failed to create initial profile:', profileError);
          // Don't throw error here, user was created successfully
        }

        notification.textContent = `Account created successfully! Your ReNex ID is: ${rexId}. You can now log in.`;
        notification.classList.add('success');
        notification.style.display = 'block';

        // Clear form
        e.target.reset();

        // Redirect after a short delay
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 3000);
      } catch (error) {
        console.error('Account creation error:', error);
        notification.textContent = 'Error creating account: ' + error.message;
        notification.classList.add('error');
        notification.style.display = 'block';

        // Clear password fields only on error
        document.querySelector('input[name="password"]').value = '';
        document.querySelector('input[name="confirm_password"]').value = '';
      }
    });

    // Function to generate ReNex ID
    function generateReNexId(phoneNumber) {
      const cleanPhone = phoneNumber.replace(/\D/g, '');
      let rexId = "7" + cleanPhone.slice(-10).padStart(10, '0');
      
      // Add random suffix to ensure uniqueness
      const randomSuffix = Math.floor(Math.random() * 100).toString().padStart(2, '0');
      rexId += randomSuffix;
      
      return rexId;
    }

    // Simple password hashing (in production, use bcrypt or similar)
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hash = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hash))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }
  </script>
</body>
