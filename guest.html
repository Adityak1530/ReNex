        <style>

            #resumeModal {
                position: fixed !important;
                top: 50% !important;
                left: 50% !important;
                transform: translate(-50%, -50%) !important;
                z-index: 1000 !important;
                width: auto !important;
                height: auto !important;
                max-width: 90vw !important;
                max-height: 90vh !important;
                min-width: 300px !important;
                min-height: 200px !important;
            }
            
            /* Prevent background scrolling when modal is open */
            body.modal-open {
                overflow: hidden !important;
                position: fixed !important;
                width: 100% !important;
            }
            
            /* Ensure modal content can scroll independently */
            #resumeContent {
                overflow-y: auto !important;
                overflow-x: hidden !important;
                max-height: 100% !important;
            }
            
            /* Prevent scroll events from bubbling up */
            #resumeModal * {
                overscroll-behavior: contain !important;

        .social-link.github {

    <!-- Direct Sanity API client - no CDN needed! -->
    <script>
        // Direct Sanity API client class
        class DirectSanityClient {
            constructor(config) {
                this.projectId = config.projectId;
                this.dataset = config.dataset;
                this.token = config.token;
                this.apiVersion = config.apiVersion;
                this.baseUrl = `https://${config.projectId}.api.sanity.io/v${this.apiVersion}/data/mutate/${config.dataset}`;
                this.queryUrl = `https://${config.projectId}.api.sanity.io/v${this.apiVersion}/data/query/${config.dataset}`;
                
                // Detect if we're in local development or production
                this.isLocalDev = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
                this.apiUrl = this.isLocalDev ? null : `${window.location.origin}/api/sanity-proxy`;
                
                console.log('Initialized Sanity client');
                console.log('Environment:', this.isLocalDev ? 'Local Development' : 'Production');
                console.log('API URL:', this.isLocalDev ? 'Direct Sanity API' : this.apiUrl);
            }
            
            async fetch(query, params = {}) {
                try {
                    console.log('Fetching data:', query, params);
                    
                    let queryUrl, requestConfig;
                    
                    if (this.isLocalDev) {
                        // Use direct Sanity API for local development
                        queryUrl = `${this.queryUrl}?query=${encodeURIComponent(query)}`;
                        
                        // Add GROQ parameters for direct API
                        if (Object.keys(params).length > 0) {
                            Object.entries(params).forEach(([key, value]) => {
                                queryUrl += `&$${key}=${encodeURIComponent(JSON.stringify(value))}`;
                            });
                        }
                        
                        requestConfig = {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.token}`
                            }
                        };
                    } else {
                        // Use API proxy for production
                        const baseUrl = window.location.origin;
                        queryUrl = `${baseUrl}/api/sanity-proxy?query=${encodeURIComponent(query)}`;
                        
                        // Add GROQ parameters in the correct format
                        if (Object.keys(params).length > 0) {
                            Object.entries(params).forEach(([key, value]) => {
                                queryUrl += `&$${key}=${encodeURIComponent(JSON.stringify(value))}`;
                            });
                        }
                        
                        // Add project ID and dataset as parameters for proxy
                        queryUrl += `&projectId=${this.projectId}&dataset=${this.dataset}`;
                        
                        requestConfig = {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        };
                    }
                    
                    console.log('Full query URL:', queryUrl);
                    
                    const response = await fetch(queryUrl, requestConfig);
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errorText}`);
                    }
                    
                    const result = await response.json();
                    console.log('Query result:', result);
                    
                    // Handle different response formats
                    if (this.isLocalDev) {
                        // Direct Sanity API returns result directly
                        return result.result;
                    } else {
                        // API proxy returns result wrapped
                        return result.result;
                    }
                    
                } catch (error) {
                    console.error('Error fetching data:', error);
                    throw error;

            // Set body styles to prevent scrolling
            document.body.style.overflow = 'hidden';
            document.body.style.position = 'fixed';
            document.body.style.width = '100%';
            document.body.style.top = `-${scrollY}px`;
            
            // Store scroll position for restoration
            document.body.dataset.scrollY = scrollY.toString();
        }
        
        // Re-enable background scrolling when modal is closed
        function enableBackgroundScrolling() {
            // Remove modal-open class from body
            document.body.classList.remove('modal-open');
            
            // Get stored scroll position
            const scrollY = document.body.dataset.scrollY;
            
            // Reset body styles
            document.body.style.overflow = '';
            document.body.style.position = '';
            document.body.style.width = '';
            document.body.style.top = '';
            
            // Restore scroll position
            if (scrollY) {
                window.scrollTo(0, parseInt(scrollY));
            }
            
            // Clean up stored data
            delete document.body.dataset.scrollY;
        }

        // Try to create a temporary public URL for the document
        function uploadToTempService(blob) {
            return new Promise((resolve, reject) => {
                // Try using a free temporary file hosting service
                const formData = new FormData();
                formData.append('file', blob, 'resume.docx');
                
                // Use tmpfiles.org or similar service (this is just an example)
                fetch('https://tmpfiles.org/api/v1/upload', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data && data.url) {
                        resolve(data.url);
                    } else {
                        reject('No URL returned');
                    }
                })
                .catch(error => {
                    console.log('Temp upload failed:', error);
                    reject(error);
                });
            });
        }
