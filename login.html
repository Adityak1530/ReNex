<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <style>
        .notification {
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        /* Ensure readonly inputs look normal */
        input[readonly] {
            background-color: white !important;
            color: #333 !important;
            cursor: text !important;
        }
        
        /* Force clear any browser autofill */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            -webkit-text-fill-color: #333 !important;
        }
        
        /* Hide image on mobile devices */
        @media (max-width: 768px) {
            .left-section {
                display: none !important;
                visibility: hidden !important;
                width: 0 !important;
                height: 0 !important;
                overflow: hidden !important;
            }
            
            .left-section .full-image {
                display: none !important;
            }
            
            .container {
                flex-direction: column !important;
            }
            
            .right-section {
                width: 100% !important;
                height: 100vh !important;
                flex: 1 !important;
            }
        }

        /* Password visibility toggle styles */
        .password-container {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            transition: color 0.3s ease;
            z-index: 2;
        }

        .password-toggle:hover {
            color: #556B2F;
        }

        .password-toggle svg {
            display: block;
        }

        .password-container input[type="password"],
        .password-container input[type="text"] {
            padding-right: 45px;
        }

        /* Remember Me Checkbox Styles */
        .remember-me-container {
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .remember-me-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            user-select: none;
            transition: color 0.3s ease;
        }

        .remember-me-label:hover {
            color: #556B2F;
        }

        .remember-me-checkbox {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkmark {
            height: 18px;
            width: 18px;
            background-color: #fff;
            border: 2px solid #ddd;
            border-radius: 4px;
            margin-right: 10px;
            position: relative;
            transition: all 0.3s ease;
        }

        .remember-me-checkbox:checked ~ .checkmark {
            background-color: #556B2F;
            border-color: #556B2F;
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
            left: 5px;
            top: 2px;
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .remember-me-checkbox:checked ~ .checkmark:after {
            display: block;
        }

        .remember-text {
            font-weight: 500;
            margin-left: 5px;
        }

        .forgot-password-link {
            margin-left: auto;
            color: #556B2F;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .forgot-password-link:hover {
            color: #3f5220;
            text-decoration: underline;
        }
    </style>
</head>

    <script>
        // Direct Sanity API client - no CDN needed!
        class DirectSanityClient {
            constructor(config) {
                this.projectId = config.projectId;
                this.dataset = config.dataset;
                this.token = config.token;
                this.apiVersion = config.apiVersion;
                this.baseUrl = `https://${config.projectId}.api.sanity.io/v${config.apiVersion}/data/mutate/${config.dataset}`;
                this.queryUrl = `https://${config.projectId}.api.sanity.io/v${config.apiVersion}/data/query/${config.dataset}`;
                
                // Detect if we're in local development or production
                this.isLocalDev = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
                this.apiUrl = this.isLocalDev ? null : `${window.location.origin}/api/sanity-proxy`;
                
                console.log('Initialized Sanity client');
                console.log('Environment:', this.isLocalDev ? 'Local Development' : 'Production');
                console.log('API URL:', this.isLocalDev ? 'Direct Sanity API' : this.apiUrl);
            }
            
            async create(doc) {
                try {
                    console.log('Creating document via direct API:', doc);
                    
                    const response = await fetch(this.baseUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.token}`
                        },
                        body: JSON.stringify({
                            mutations: [{
                                create: doc
                            }]
                        })
                    });
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errorText}`);
                    }
                    
                    const result = await response.json();
                    console.log('Document created successfully:', result);
                    
                    // Return the created document with ID
                    if (result.results && result.results[0]) {
                        return {
                            _id: result.results[0].id,
                            ...doc
                        };
                    }
                    
                    return result;
                    
                } catch (error) {
                    console.error('Error creating document:', error);
                    throw error;
                }
            }
            
            async fetch(query, params = {}, retryCount = 0, maxRetries = 3) {
                try {
                    console.log('Fetching data:', query, params);
                    console.log('Retry attempt:', retryCount);
                    
                    let queryUrl, requestConfig;
                    
                    if (this.isLocalDev) {
                        // Use direct Sanity API for local development
                        queryUrl = `${this.queryUrl}?query=${encodeURIComponent(query)}`;
                        
                        // Add GROQ parameters for direct API
                        if (Object.keys(params).length > 0) {
                            Object.entries(params).forEach(([key, value]) => {
                                queryUrl += `&$${key}=${encodeURIComponent(JSON.stringify(value))}`;
                            });
                        }
                        
                        // Add cache-busting parameter for retries
                        if (retryCount > 0) {
                            queryUrl += `&_cb=${Date.now()}`;
                        }
                        
                        requestConfig = {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.token}`
                            }
                        };
                    } else {
                        // Use API proxy for production
                        const baseUrl = window.location.origin;
                        queryUrl = `${baseUrl}/api/sanity-proxy?query=${encodeURIComponent(query)}`;
                        
                        // Add GROQ parameters in the correct format
                        if (Object.keys(params).length > 0) {
                            Object.entries(params).forEach(([key, value]) => {
                                queryUrl += `&$${key}=${encodeURIComponent(JSON.stringify(value))}`;
                            });
                        }
                        
                        // Add project ID and dataset as parameters for proxy
                        queryUrl += `&projectId=${this.projectId}&dataset=${this.dataset}`;
                        
                        // Add cache-busting parameter for retries
                        if (retryCount > 0) {
                            queryUrl += `&_cb=${Date.now()}`;
                        }
                        
                        requestConfig = {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        };
                    }
                    
                    console.log('Full query URL:', queryUrl);
                    
                    // Create abort controller for timeout
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 10000);
                    requestConfig.signal = controller.signal;
                    
                    const response = await fetch(queryUrl, requestConfig);
                    
                    // Clear the timeout
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) {
                        // If we haven't exceeded max retries and it's a 404 or 5xx error, retry
                        if (retryCount < maxRetries && (response.status === 404 || response.status >= 500)) {
                            console.log(`Retrying after ${response.status} error (attempt ${retryCount + 1} of ${maxRetries})`);
                            // Exponential backoff: wait longer between each retry
                            const backoffTime = Math.min(1000 * Math.pow(2, retryCount), 8000);
                            await new Promise(resolve => setTimeout(resolve, backoffTime));
                            return this.fetch(query, params, retryCount + 1, maxRetries);
                        }
                        
                        // If we've exhausted retries or it's not a retryable error, handle the error
                        let errorMessage = `HTTP ${response.status}`;
                        try {
                            // Try to parse error as JSON
                            const errorJson = await response.json();
                            errorMessage += `: ${errorJson.message || errorJson.error || 'Unknown error'}`;
                        } catch (e) {
                            // If not JSON, get as text
                            const errorText = await response.text();
                            errorMessage += `: ${errorText || 'The page could not be found'}`;
                        }
                        throw new Error(errorMessage);
                    }
                    
                    const result = await response.json();
                    console.log('Query result:', result);
                    
                    // Check if result has the expected structure
                    if (!result || result.error) {
                        throw new Error(result.error || 'Invalid response from server');
                    }
                    
                    // Handle different response formats
                    if (this.isLocalDev) {
                        // Direct Sanity API returns result directly
                        return result.result;
                    } else {
                        // API proxy returns result wrapped
                        return result.result;
                    }
                    
                } catch (error) {
                    console.error('Error fetching data:', error);
                    
                    // Handle network errors and retry if appropriate
                    if (error.name === 'AbortError') {
                        console.log('Request timed out');
                        if (retryCount < maxRetries) {
                            console.log(`Retrying after timeout (attempt ${retryCount + 1} of ${maxRetries})`);
                            const backoffTime = Math.min(1000 * Math.pow(2, retryCount), 8000);
                            await new Promise(resolve => setTimeout(resolve, backoffTime));
                            return this.fetch(query, params, retryCount + 1, maxRetries);
                        }
                        throw new Error('Connection timed out after multiple attempts. Please check your internet connection.');
                    }
                    
                    // For network errors, also retry
                    if (error.message.includes('NetworkError') || error.message.includes('Failed to fetch')) {
                        if (retryCount < maxRetries) {
                            console.log(`Retrying after network error (attempt ${retryCount + 1} of ${maxRetries})`);
                            const backoffTime = Math.min(1000 * Math.pow(2, retryCount), 8000);
                            await new Promise(resolve => setTimeout(resolve, backoffTime));
                            return this.fetch(query, params, retryCount + 1, maxRetries);
                        }
                    }
                    
                    throw error;
                }
            }
        }

                // Show "eye" icon when password is hidden
                svg.setAttribute('d', 'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.61-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z');

        // Setup login handling
        function setupLoginHandling() {
            // Mode toggle functionality
            const hostBtn = document.getElementById('hostBtn');
            const guestBtn = document.getElementById('guestBtn');
            const hostForm = document.getElementById('hostForm');
            const guestForm = document.getElementById('guestForm');

            hostBtn.addEventListener('click', () => {
                hostBtn.classList.add('active');
                guestBtn.classList.remove('active');
                hostForm.classList.remove('hidden');
                guestForm.classList.add('hidden');
                
                // Clear the host form when it's shown
                setTimeout(() => {
                    const hostInputs = hostForm.querySelectorAll('input');
                    hostInputs.forEach(input => {
                        input.value = '';
                        input.setAttribute('value', '');
                        input.defaultValue = '';
                    });
                    hostForm.reset();
                }, 50);
            });

            guestBtn.addEventListener('click', () => {
                guestBtn.classList.add('active');
                hostBtn.classList.remove('active');
                guestForm.classList.remove('hidden');
                hostForm.classList.add('hidden');
                
                // Clear the guest form when it's shown
                setTimeout(() => {
                    const guestInputs = guestForm.querySelectorAll('input');
                    guestInputs.forEach(input => {
                        input.value = '';
                        input.setAttribute('value', '');
                        input.defaultValue = '';
                    });
                    guestForm.reset();
                }, 50);
            });

            // Function to show notification
            function showNotification(message, type) {
                // Create notification element if it doesn't exist
                let notification = document.querySelector('.notification');
                if (!notification) {
                    notification = document.createElement('div');
                    notification.className = 'notification';
                    document.querySelector('.login-card').appendChild(notification);
                }
                
                // Set notification content and type
                notification.textContent = message;
                notification.className = 'notification ' + type;
                notification.style.display = 'block';
                
                // Auto-hide after 5 seconds
                setTimeout(() => {
                    notification.style.display = 'none';
                }, 5000);
            }
            
            // Host login form
            hostForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('hostUsername').value;
                const password = document.getElementById('hostPassword').value;
                
                // Basic validation
                if (!email || !password) {
                    showNotification('Please enter both email and password', 'error');
                    return;
                }
                
                try {
                    console.log('Attempting login for:', email);
                    
                    // Hash password for comparison
                    const passwordHash = await hashPassword(password);
                    
                    // Find user by email
                    const userQuery = `*[_type == "user" && email == $email][0]`;
                    
                    // Show loading state
                    const submitBtn = hostForm.querySelector('button[type="submit"]');
                    const originalBtnText = submitBtn.textContent;
                    submitBtn.textContent = 'Logging in...';
                    submitBtn.disabled = true;
                    
                    // Set timeout for API request to handle connectivity issues
                    const timeoutPromise = new Promise((_, reject) => 
                        setTimeout(() => reject(new Error('Connection timed out. Please check your internet connection.')), 10000)
                    );
                    
                    try {
                        // Use Promise.race to implement timeout
                        const user = await Promise.race([
                            client.fetch(userQuery, { email: email }),
                            timeoutPromise
                        ]);
                        
                        if (!user) {
                            showNotification('No account found with this email. Please create an account first.', 'error');
                            return;
                        }
                        
                        // Check password
                        if (user.passwordHash === passwordHash) {
                            console.log('Login successful for:', user);
                            
                            // Handle Remember Me functionality
                            const rememberMe = document.getElementById('rememberMe').checked;
                            if (rememberMe) {
                                saveCredentials(email, password);
                            } else {
                                clearSavedCredentials();
                            }
                            
                            // Show success message
                            showNotification('Login successful! Redirecting...', 'success');
                            
                            // Store user data in session
                            sessionStorage.setItem('renx_cached_user', JSON.stringify(user));
                            
                            // Redirect to profile after a short delay
                            setTimeout(() => {
                                window.location.href = 'profile.html';
                            }, 1000);
                        } else {
                            showNotification('Incorrect password. Please try again.', 'error');
                        }
                    } catch (error) {
                        console.error('Login error:', error);
                        
                        // Show user-friendly error message based on error type
                        if (error.message.includes('404')) {
                            showNotification('Server connection error. The API endpoint could not be found. Please try again later.', 'error');
                        } else if (error.message.includes('timeout') || error.message.includes('timed out')) {
                            showNotification('Connection timed out. Please check your internet connection and try again.', 'error');
                        } else if (error.message.includes('NetworkError') || error.message.includes('Failed to fetch')) {
                            showNotification('Network error. Please check your internet connection and try again.', 'error');
                        } else if (error.message.includes('500')) {
                            showNotification('Server error. Our team has been notified and is working on a fix. Please try again later.', 'error');
                        } else {
                            showNotification('Login failed: ' + error.message, 'error');
                        }
                    } finally {
                        // Reset button state
                        submitBtn.textContent = originalBtnText;
                        submitBtn.disabled = false;
                    }
                    
                } catch (error) {
                    console.error('Password hashing error:', error);
                    showNotification('An unexpected error occurred. Please try again.', 'error');
                }
            });

            // Guest access form
            guestForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const rexId = document.getElementById('guestID').value.trim();
                
                if (rexId) {
                    // Redirect to guest page with ReNex ID
                    window.location.href = `guest.html?id=${rexId}`;
                }
            });

            // Set host as default active
            hostBtn.click();
        }
        
        // Hash password function
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }
        
        // Remember Me functionality
        function saveCredentials(email, password) {
            try {
                const credentials = {
                    email: email,
                    password: password,
                    timestamp: Date.now()
                };
                localStorage.setItem('renx_remember_me', JSON.stringify(credentials));
                console.log('✅ Credentials saved for Remember Me');
            } catch (error) {
                console.error('❌ Error saving credentials:', error);
            }
        }

        function loadSavedCredentials() {
            try {
                const saved = localStorage.getItem('renx_remember_me');
                if (saved) {
                    const credentials = JSON.parse(saved);
                    const rememberMeCheckbox = document.getElementById('rememberMe');
                    
                    // Check if credentials are still valid (not older than 30 days)
                    const thirtyDaysAgo = Date.now() - (30 * 24 * 60 * 60 * 1000);
                    if (credentials.timestamp > thirtyDaysAgo) {
                        // Restore credentials
                        document.getElementById('hostUsername').value = credentials.email;
                        document.getElementById('hostPassword').value = credentials.password;
                        rememberMeCheckbox.checked = true;
                        console.log('✅ Saved credentials restored');
                    } else {
                        // Clear expired credentials
                        localStorage.removeItem('renx_remember_me');
                        console.log('🗑️ Expired credentials cleared');
                    }
                }
            } catch (error) {
                console.error('❌ Error loading saved credentials:', error);
                localStorage.removeItem('renx_remember_me');
            }
        }

        function clearSavedCredentials() {
            try {
                localStorage.removeItem('renx_remember_me');
                console.log('🗑️ Saved credentials cleared');
            } catch (error) {
                console.error('❌ Error clearing saved credentials:', error);
            }
        }

        function handleForgotPassword() {
            showNotification('Password reset functionality coming soon! Please contact support for now.', 'error');
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Setting up login handling...');
            
            // Ensure all forms are completely clean on page load
            const hostForm = document.getElementById('hostForm');
            const guestForm = document.getElementById('guestForm');
            const allInputs = document.querySelectorAll('input');
            
            // Clear all input values multiple times to ensure they're empty
            function clearAllForms() {
                allInputs.forEach(input => {
                    input.value = '';
                    input.setAttribute('value', '');
                    input.defaultValue = '';
                    input.checked = false;
                    input.selected = false;
                });
                
                // Reset all forms
                hostForm.reset();
                guestForm.reset();
                
                // Force clear any remaining values
                setTimeout(() => {
                    allInputs.forEach(input => {
                        input.value = '';
                        input.setAttribute('value', '');
                    });
                }, 100);
            }
            
            // Clear forms immediately
            clearAllForms();
            
            // Clear forms again after a short delay
            setTimeout(clearAllForms, 200);
            
            // Clear forms one more time after everything loads
            setTimeout(clearAllForms, 500);
            
            // Load saved credentials if Remember Me was checked
            loadSavedCredentials();
            
            setupLoginHandling();
        });
    </script>
</body>
</html>
